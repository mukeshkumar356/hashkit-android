plugins {
    id 'com.android.application' version '8.9.0' apply false
}

// Build output redirected outside OneDrive — OneDrive's real-time sync locks files
// inside app/build/intermediates during the build, causing random
// "Unable to delete directory" failures (mergeReleaseJniLibFolders,
// mergeReleaseNativeLibs, etc.) if left under the synced Desktop folder.
allprojects {
    buildDir = "C:/AndroidBuilds/HashKitAndroid/${project.name}"
}
